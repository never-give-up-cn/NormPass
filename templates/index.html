<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 中文密码测试</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎉 登录成功</h1>
            <div class="success-icon">✅</div>
            <p class="welcome-text">
                欢迎回来，<strong>{{ username }}</strong>！
            </p>

            <div class="test-section">
                <h2>🧪 测试场景参考</h2>
                <ul class="scenario-list">
                    <li>
                        <strong>常规中文密码：</strong>注册后默认 UTF-8 登录即可
                    </li>
                    <li>
                        <strong>生僻字（䂙）：</strong>注册时用中文生僻字，登录选 GBK → 会触发<em>编码不兼容</em>提示
                    </li>
                    <li>
                        <strong>Emoji 密码（😀）：</strong>注册含 Emoji 的密码，登录选 GBK → 触发编码不兼容
                    </li>
                    <li>
                        <strong>编码兼容：</strong>选 UTF-8 失败时，尝试 GBK 等编码
                    </li>
                    <li>
                        <strong>简繁体：</strong>"后" 和 "後" 是不同的字，密码输入会区分
                    </li>
                    <li>
                        <strong>错误锁定：</strong>连续 5 次密码错误，账号锁定 10 分钟
                    </li>
                </ul>
            </div>

            <a href="{{ url_for('logout') }}" class="btn btn-secondary">退出登录</a>
        </div>
    </div>
</body>
</html>
